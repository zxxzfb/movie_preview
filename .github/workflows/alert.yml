name: Stage Greeting Alert

on:
  schedule:
    # 한국 시간 기준 매일 09:00, 15:00 실행 (UTC 기준 00:00, 06:00)
    - cron: '0 0,6 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Crawler & Alert
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_KEY: ${{ secrets.SENDER_KEY }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
          SEND_HOUR_MORNING: 9
          SEND_HOUR_AFTERNOON: 15
        run: python main.py

      - name: Commit and push sent events history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/sent_events.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent events history [skip ci]" && git push)
